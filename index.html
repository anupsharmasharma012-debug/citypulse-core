<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityPulse - Home</title>
    <!-- Master CSS -->
    <link rel="stylesheet" href="https://anupsharmasharma012-debug.github.io/citypulse-core/style.css">
</head>
<body>
    <div class="max-width-container">
        <!-- Smart Header -->
        <city-header></city-header>

        <main style="padding: 10px 16px; display: flex; flex-direction: column; margin-bottom: 80px;">
            <!-- Dynamic Ad Space -->
            <city-ad-space></city-ad-space>

            <!-- Deep Content: Welcome & Quick Actions -->
            <div class="cp-card flex-column gap-3">
                <h2 style="margin: 0; font-size: 18px;">Welcome to CityPulse</h2>
                <p style="margin: 0; font-size: 13px; color: var(--text-muted); line-height: 1.5;">
                    Aapka apna Super App. Explore local news, raise civic issues, and connect with your local marketplace.
                </p>
                <div class="d-flex gap-2" style="margin-top: 10px;">
                    <a href="https://anupsharmasharma012-debug.github.io/citypulse-media-civic/civic.html" class="cp-btn-primary">Raise Complaint</a>
                    <a href="https://anupsharmasharma012-debug.github.io/citypulse-profile/profile.html" class="cp-btn-outline">My Profile</a>
                </div>
            </div>

            <!-- Deep Content: Upcoming Features Section -->
            <div class="cp-card">
                <div class="flex-between" style="margin-bottom: 12px;">
                    <h3 style="margin: 0; font-size: 15px;">Local Services (Coming Soon)</h3>
                    <span class="cp-badge-success">Hyperlocal</span>
                </div>
                <div class="d-flex gap-3" style="overflow-x: auto; padding-bottom: 5px;">
                    <div style="background: rgba(150,150,150,0.05); border: 1px solid var(--card-border); padding: 12px; border-radius: 12px; min-width: 100px; text-align: center;">
                        <div style="font-size: 24px; margin-bottom: 5px;">🛒</div>
                        <div style="font-size: 11px; font-weight: 600;">Marketplace</div>
                    </div>
                    <div style="background: rgba(150,150,150,0.05); border: 1px solid var(--card-border); padding: 12px; border-radius: 12px; min-width: 100px; text-align: center;">
                        <div style="font-size: 24px; margin-bottom: 5px;">🚕</div>
                        <div style="font-size: 11px; font-weight: 600;">Mobility</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Smart Bottom Nav -->
        <bottom-nav></bottom-nav>
    </div>

    <!-- The Master Engine: Core Scripts -->
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/config.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/store.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/utils.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/auth-guard.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/api.js"></script>
    <script src="https://anupsharmasharma012-debug.github.io/citypulse-core/components.js"></script>
</body>
</html>
